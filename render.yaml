services:
  - type: web
    name: dobot-realtime-relay
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 3002
      - key: AUTH_SECRET
        generateValue: true
      - key: HOST_USERNAME
        value: atharv
      - key: HOST_PASSWORD
        value: atharv123
      - key: CONTROLLER_USERNAME
        value: test
      - key: CONTROLLER_PASSWORD
        value: test123
